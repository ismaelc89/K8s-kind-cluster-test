---
name: Validate Kubernetes Manifests

'on':
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your code repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Run YAML Lint to check formatting and syntax
      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable

      # 3. Set up Kubeconform to validate Kubernetes API schemas
      - name: Run Kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: '/kubeconform'
          args: "-strict -kubernetes-version 1.30.0 /github/workspace"
