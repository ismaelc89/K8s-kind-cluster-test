apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Custom K8s Index</title>
    </head>
    <body style="background-color: #1a1a1a; color: #00ffcc; font-family: monospace; text-align: center; padding-top: 50px;">
        <h1>Hello from Ismael's Custom Kubernetes ConfigMap!</h1>
        <p>This page is served from a mounted ConfigMap volume inside a local Kind cluster.</p>
    </body>
    </html>