---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: test-configmap
                  key: welcome_message
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html  # Mounts just this specific file without overwriting the whole directory
            - name: k8s-volume
              mountPath: /tmp
      volumes:
        - name: html-volume
          configMap:
            name: nginx-html-config-v1
        - name: k8s-volume
          persistentVolumeClaim:
            claimName: local-pvc
