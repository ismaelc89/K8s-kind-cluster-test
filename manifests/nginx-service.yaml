---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - port: 80          # Port inside the cluster service
      targetPort: 80    # The port on the pod where traffic gets sent (must match containerPort!)
      nodePort: 30080   # Must match the containerPort in your kind-config.yaml!
  type: NodePort
      